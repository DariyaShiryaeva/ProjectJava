<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список продуктов</title>
</head>
<body>
<h2>Продукты</h2>

<div th:if="${success}" th:text="${success}" style="color:green;"></div>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Название</th>
    <th>Цена</th>
    <th>Действия</th>
  </tr>
  <tr th:each="product : ${products}">
    <td th:text="${product.id}"></td>
    <td th:text="${product.name}"></td>
    <td th:text="${product.price}"></td>
    <td>
      <a th:href="@{/products/edit/{id}(id=${product.id})}">Редактировать</a>
      <a th:href="@{/products/delete/{id}(id=${product.id})}" onclick="return confirm('Вы уверены?')">Удалить</a>
    </td>
  </tr>
</table>

<br>
<a th:href="@{/products/new}">Добавить новый продукт</a>
</body>
</html>
