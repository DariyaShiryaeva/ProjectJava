<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Список пользователей</title>
</head>
<body>
<h2>Пользователи</h2>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Имя</th>
    <th>Отчество</th>
    <th>Фамилия</th>
    <th>Email</th>
    <th>Действия</th>
  </tr>
  <tr th:each="user : ${users}">
    <td th:text="${user.id}"></td>
    <td th:text="${user.firstName}"></td>
    <td th:text="${user.middleName}"></td>
    <td th:text="${user.lastName}"></td>
    <td th:text="${user.email}"></td>
    <td>
      <a th:href="@{/users/edit/{id}(id=${user.id})}">Редактировать</a>
      <a th:href="@{/users/delete/{id}(id=${user.id})}" onclick="return confirm('Вы уверены?')">Удалить</a>
    </td>
  </tr>
</table>

<br>
<a th:href="@{/users/new}">Добавить пользователя</a>
</body>
</html>
