<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Форма продукта</title>
</head>
<body>
<h2 th:text="${product.id} != null ? 'Редактировать продукт' : 'Добавить продукт'"></h2>

<form th:action="@{/products}" th:object="${product}" method="post">
  <input type="hidden" th:field="*{id}" />

  <label>Название:</label>
  <input type="text" th:field="*{name}" placeholder="Название продукта" required />
  <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

  <label>Цена:</label>
  <input type="number" th:field="*{price}" min="1" step="0.01" placeholder="Цена" required />
  <div th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>

  <button type="submit">Сохранить</button>
</form>

<a th:href="@{/products}">Назад к списку продуктов</a>
</body>
</html>
